name: Publish static UAT frontend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require production API configuration
        run: node --input-type=module -e "import {API_BASE_URL} from './web/config.js'; if(!API_BASE_URL.startsWith('https://')) throw Error('Run scripts/configure-web.js with your deployed HTTPS Worker origin first');"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
